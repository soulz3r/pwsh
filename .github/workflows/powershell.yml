name: PowerShell checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate syntax and profile behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/validate.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -RequiredVersion 1.24.0 -Force
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          $issues | Format-Table -AutoSize
          if ($issues.Count -gt 0) {
              throw "PSScriptAnalyzer reported $($issues.Count) error(s)."
          }
