#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 4
final_space = true
console_title_template = '{{ .Shell }} · {{ .Folder }}'

# Line one: path and Git context as separate Everforest chips.
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'path'
    style = 'diamond'
    leading_diamond = ''
    trailing_diamond = ''
    foreground = '#2D353B'
    background = '#A7C080'
    template = '  {{ .Path }} '

    [blocks.segments.properties]
      style = 'agnoster_git'
      max_width = 42
      folder_icon = '…'
      folder_separator_icon = ' / '
      hide_root_location = false

  [[blocks.segments]]
    type = 'git'
    style = 'diamond'
    leading_diamond = ''
    trailing_diamond = ''
    foreground = '#D3C6AA'
    background = '#3D4843'
    template = '  {{ .HEAD }}{{ if .Staging.Changed }}  <#A7C080>●</>{{ end }}{{ if .Working.Changed }}  <#DBBC7F>✚</>{{ end }} '

    [blocks.segments.properties]
      branch_icon = ''
      commit_icon = '@'
      resolve_rebase_target = false

# Line two: mode-colored Vi chip, optional command duration, and input arrow.
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'vimode'
    style = 'diamond'
    leading_diamond = ''
    trailing_diamond = ''
    foreground = '#2D353B'
    background_templates = [
      '{{if eq .Mode "insert"}}#A7C080{{else if eq .Mode "normal"}}#DBBC7F{{else if eq .Mode "visual"}}#7FBBB3{{else if eq .Mode "viopp"}}#D699B6{{else if eq .Mode "replace"}}#E67E80{{else}}#D3C6AA{{end}}',
    ]
    template = '  {{if eq .Mode "insert"}}I{{else if eq .Mode "normal"}}N{{else if eq .Mode "visual"}}V{{else if eq .Mode "viopp"}}O{{else if eq .Mode "replace"}}R{{else}}{{upper .Mode}}{{end}} '

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    foreground = '#7A8478'
    background = 'transparent'
    template = '  󰔛 {{ .FormattedMs }}'

    [blocks.segments.properties]
      threshold = 1000
      style = 'round'

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = [
      '{{if gt .Code 0}}#E67E80{{else}}#A7C080{{end}}',
    ]
    background = 'transparent'
    template = '  ❯ '

[transient_prompt]
  foreground_templates = [
    '{{if gt .Code 0}}#E67E80{{else}}#A7C080{{end}}',
  ]
  background = 'transparent'
  template = '❯ '

[secondary_prompt]
  foreground = '#D699B6'
  background = 'transparent'
  template = '  ❯❯ '
