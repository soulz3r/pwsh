#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 4
final_space = true

# First line: location and local Git state.
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    foreground = '#A7C080'
    background = 'transparent'
    template = '{{ .Path }}'

    [blocks.segments.properties]
      style = 'agnoster_git'
      max_width = 42
      folder_icon = '…'
      folder_separator_icon = '/'

  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    foreground = '#7A8478'
    background = 'transparent'
    template = '  {{ .HEAD }}{{ if .Staging.Changed }} +{{ end }}{{ if .Working.Changed }} *{{ end }}'

    [blocks.segments.properties]
      branch_icon = ''
      commit_icon = '@'
      resolve_rebase_target = false

# Second line: input arrow.
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = [
      '{{if gt .Code 0}}#E67E80{{else}}#A7C080{{end}}',
    ]
    background = 'transparent'
    template = '❯ '

[transient_prompt]
  foreground_templates = [
    '{{if gt .Code 0}}#E67E80{{else}}#A7C080{{end}}',
  ]
  background = 'transparent'
  template = '❯ '

[secondary_prompt]
  foreground = '#D699B6'
  background = 'transparent'
  template = '❯❯ '
